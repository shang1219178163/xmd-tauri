name: Release

# 只有形如 v1.2.3 的 tag 才会触发；tag 推送到 main 即可自动出包并发布 Release。
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS · ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            target: aarch64-apple-darwin
            runner: macos-15
          - label: Intel
            target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - name: 校验 tag 格式
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 必须形如 v1.2.3，实际为 ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: 同步版本号到 package.json 与 tauri.conf.json
        shell: bash
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = process.env.VERSION;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
            console.log("version ->", process.env.VERSION);
          '

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: xmd ${{ github.ref_name }}
          releaseBody: |
            xmd ${{ github.ref_name }} 自动构建产物（未签名）。

            - Apple Silicon：`xmd_*_aarch64.dmg`
            - Intel：`xmd_*_x64.dmg`

            首次打开若提示「无法验证开发者」，请在 Finder 中右键 → 打开。
            完整变更见仓库内 `CHANGELOG.md`。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
