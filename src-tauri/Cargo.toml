[package]
name = "xmd"
version = "1.0.0"
description = "A complete offline mind-mapping desktop app inspired by Xmind"
authors = ["xmd"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "xmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSGeometry"] }
block2 = "0.6"
